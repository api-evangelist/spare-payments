aid: spare-payments
name: Spare Payments
description: >-
  Spare (Spare L.L.C., paywithspare.com) is a school management and cashless-payments
  platform that digitizes payments and automates internal school processes using
  contactless technology — wristbands, phones, student ID cards, and QR codes. It
  serves schools, parents, and vendors through a centralized admin dashboard with
  permission controls, parent spending limits and dietary/allergen monitoring, vendor
  inventory tools, and attendance tracking. Spare exposes a REST API (JSON over HTTPS,
  standard HTTP verbs and status codes) that has not yet been opened to the public;
  its webhook surface is publicly documented so external inventory and attendance
  systems can react to Spare events in near real time. Backed by 500 Global.
